<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="640" viewBox="0 0 1280 640" role="img" aria-labelledby="title desc">
  <title id="title">Qarinah - stop replaying entire agent histories</title>
  <desc id="desc">A large history stream narrows into a small cited context pack with 98.71 percent less estimated context.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#07110f"/><stop offset="1" stop-color="#050807"/></linearGradient>
    <radialGradient id="glow"><stop stop-color="#25e6a1" stop-opacity=".22"/><stop offset="1" stop-color="#25e6a1" stop-opacity="0"/></radialGradient>
    <pattern id="grid" width="44" height="44" patternUnits="userSpaceOnUse"><path d="M44 0H0V44" fill="none" stroke="#244239" stroke-width="1" opacity=".3"/></pattern>
  </defs>
  <rect width="1280" height="640" fill="url(#bg)"/><rect width="1280" height="640" fill="url(#grid)"/><circle cx="960" cy="320" r="300" fill="url(#glow)"/>
  <g transform="translate(68 58)">
    <g transform="scale(.19)" fill="none" stroke="#25e6a1" stroke-linecap="round" stroke-linejoin="round"><path d="M194 174A84 84 0 1 0 174 194L216 216V184L194 174Z" stroke-width="18"/><path d="M174 194L201 201" stroke-width="18"/><g fill="#25e6a1" stroke="none"><circle cx="128" cy="44" r="11"/><circle cx="52" cy="128" r="11"/><circle cx="128" cy="212" r="11"/><circle cx="128" cy="128" r="13"/></g></g>
    <text x="62" y="34" fill="#f4f3ec" font-family="Arial, sans-serif" font-size="24" font-weight="700" letter-spacing="8">QARINAH</text>
  </g>
  <text x="70" y="210" fill="#f4f3ec" font-family="Arial, sans-serif" font-size="62" font-weight="750" letter-spacing="-2">Stop replaying</text>
  <text x="70" y="278" fill="#f4f3ec" font-family="Arial, sans-serif" font-size="62" font-weight="750" letter-spacing="-2">entire agent histories.</text>
  <text x="72" y="340" fill="#9fb2aa" font-family="Arial, sans-serif" font-size="23">Small cited packs. Every result points back to evidence.</text>
  <g transform="translate(72 410)"><rect width="540" height="82" rx="10" fill="#0c1714" stroke="#2f5c4d"/><text x="24" y="34" fill="#25e6a1" font-family="Arial, sans-serif" font-size="27" font-weight="750">98.71% LESS ESTIMATED CONTEXT</text><text x="24" y="61" fill="#9fb2aa" font-family="Arial, sans-serif" font-size="15">442,113 → 5,682 estimated input tokens</text></g>
  <g transform="translate(700 112)">
    <text x="0" y="0" fill="#7e9189" font-family="monospace" font-size="13" letter-spacing="2">FULL HISTORY</text>
    <g stroke="#325449" stroke-width="2"> <path d="M0 35H280"/><path d="M0 65H250"/><path d="M0 95H290"/><path d="M0 125H230"/><path d="M0 155H270"/><path d="M0 185H215"/><path d="M0 215H295"/><path d="M0 245H240"/></g>
    <path d="M310 140h52" stroke="#25e6a1" stroke-width="5" stroke-dasharray="8 7"/><path d="m353 129 18 11-18 11" fill="#25e6a1"/>
    <g transform="translate(390 64)"><rect width="175" height="164" rx="12" fill="#0d1d18" stroke="#25e6a1"/><text x="18" y="34" fill="#25e6a1" font-family="monospace" font-size="12">CITED PACK</text><path d="M18 62h132M18 88h110M18 114h124" stroke="#8fb3a6" stroke-width="3"/><text x="18" y="145" fill="#f4f3ec" font-family="monospace" font-size="11">event IDs + hashes</text></g>
  </g>
  <text x="70" y="585" fill="#7e9189" font-family="monospace" font-size="13">LOCAL-FIRST / APACHE-2.0 / CODEX + CLAUDE CODE / NO QARINAH API KEY</text>
</svg>
