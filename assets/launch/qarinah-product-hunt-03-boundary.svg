<svg xmlns="http://www.w3.org/2000/svg" width="1270" height="760" viewBox="0 0 1270 760" role="img" aria-labelledby="title desc">
  <title id="title">Qarinah privacy and host boundary</title>
  <desc id="desc">Qarinah requires project opt-in, records metadata by default, and supports Codex, Claude Code, CLI, and read-only MCP diagnostics.</desc>
  <defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#07110f"/><stop offset="1" stop-color="#050807"/></linearGradient><pattern id="grid" width="44" height="44" patternUnits="userSpaceOnUse"><path d="M44 0H0V44" fill="none" stroke="#244239" opacity=".28"/></pattern></defs>
  <rect width="1270" height="760" fill="url(#bg)"/><rect width="1270" height="760" fill="url(#grid)"/>
  <text x="62" y="72" fill="#25e6a1" font-family="monospace" font-size="15" letter-spacing="3">PRODUCT HUNT / PROOF 03</text>
  <text x="62" y="146" fill="#f4f3ec" font-family="Arial, sans-serif" font-size="54" font-weight="750">Memory starts with permission.</text>
  <text x="62" y="194" fill="#9fb2aa" font-family="Arial, sans-serif" font-size="22">Install once. Trust and retained context remain project-specific.</text>
  <g transform="translate(62 260)"><rect width="1146" height="330" rx="16" fill="#0b1713" stroke="#31564a"/>
    <g font-family="monospace" font-size="15"><text x="42" y="54" fill="#25e6a1">SUPPORTED HOSTS</text><g fill="#f4f3ec"><text x="42" y="98">CODEX PLUGIN</text><text x="42" y="138">CLAUDE CODE PLUGIN</text><text x="42" y="178">LOCAL CLI</text><text x="42" y="218">READ-ONLY MCP DIAGNOSTICS</text></g></g>
    <path d="M360 54V276" stroke="#31564a"/>
    <g font-family="monospace" font-size="15"><text x="404" y="54" fill="#25e6a1">DEFAULT BOUNDARY</text><g fill="#f4f3ec"><text x="404" y="98">PROJECT OPT-IN</text><text x="404" y="138">MACHINE-LOCAL TRUST</text><text x="404" y="178">METADATA-ONLY CAPTURE</text><text x="404" y="218">CONTENT REQUIRES EXPLICIT CONSENT</text></g></g>
    <path d="M782 54V276" stroke="#31564a"/>
    <g font-family="monospace" font-size="15"><text x="826" y="54" fill="#ffb589">OUTSIDE THE PRODUCT</text><g fill="#cbd8d2"><text x="826" y="98">HIDDEN REASONING</text><text x="826" y="138">CREDENTIALS</text><text x="826" y="178">BROWSER SESSION STATE</text><text x="826" y="218">PRIVATE TRANSCRIPT SCRAPING</text></g></g>
  </g>
  <text x="62" y="650" fill="#f4f3ec" font-family="Arial, sans-serif" font-size="20">No Qarinah API key. Local storage. Tamper-evident events. Revocable trust.</text>
  <text x="62" y="700" fill="#7e9189" font-family="monospace" font-size="13">LOCAL-FIRST / APACHE-2.0 / EXPLICIT CONSENT</text><text x="1208" y="700" text-anchor="end" fill="#25e6a1" font-family="monospace" font-size="13">QARINAH</text>
</svg>
