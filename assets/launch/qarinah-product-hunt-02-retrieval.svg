<svg xmlns="http://www.w3.org/2000/svg" width="1270" height="760" viewBox="0 0 1270 760" role="img" aria-labelledby="title desc">
  <title id="title">Qarinah cited context compilation</title>
  <desc id="desc">Fuzzy text, explicit relations, and deterministic diversity select complete records into a cited context pack.</desc>
  <defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#07110f"/><stop offset="1" stop-color="#050807"/></linearGradient><pattern id="grid" width="44" height="44" patternUnits="userSpaceOnUse"><path d="M44 0H0V44" fill="none" stroke="#244239" opacity=".28"/></pattern></defs>
  <rect width="1270" height="760" fill="url(#bg)"/><rect width="1270" height="760" fill="url(#grid)"/>
  <text x="62" y="72" fill="#25e6a1" font-family="monospace" font-size="15" letter-spacing="3">PROOF 02 / CITED RETRIEVAL</text>
  <text x="62" y="146" fill="#f4f3ec" font-family="Arial, sans-serif" font-size="54" font-weight="750">Retrieve the decision, not the transcript.</text>
  <text x="62" y="194" fill="#9fb2aa" font-family="Arial, sans-serif" font-size="22">Qarinah compiles complete records. Every selected item keeps its evidence identity.</text>
  <g transform="translate(70 270)" font-family="monospace"><g fill="#0b1713" stroke="#31564a"><rect width="238" height="76" rx="12"/><rect y="108" width="238" height="76" rx="12"/><rect y="216" width="238" height="76" rx="12"/></g><text x="24" y="46" fill="#f4f3ec" font-size="16">FUZZY TEXT MATCH</text><text x="24" y="154" fill="#f4f3ec" font-size="16">EXPLICIT RELATIONS</text><text x="24" y="262" fill="#f4f3ec" font-size="16">DIVERSITY + BUDGET</text></g>
  <g stroke="#25e6a1" stroke-width="3" fill="none"><path d="M330 308H500"/><path d="M330 416H500"/><path d="M330 524H500"/><path d="M500 308V524"/><path d="M500 416H620"/></g><circle cx="500" cy="416" r="9" fill="#25e6a1"/>
  <g transform="translate(620 254)"><rect width="582" height="326" rx="16" fill="#0d1d18" stroke="#25e6a1"/><text x="32" y="52" fill="#25e6a1" font-family="monospace" font-size="16">CITED CONTEXT PACK</text><g fill="#152820" stroke="#31564a"><rect x="32" y="78" width="518" height="56" rx="8"/><rect x="32" y="150" width="518" height="56" rx="8"/><rect x="32" y="222" width="518" height="56" rx="8"/></g><g fill="#f4f3ec" font-family="monospace" font-size="14"><text x="52" y="112">decision / source / relation / event hash</text><text x="52" y="184">contradiction remains visible</text><text x="52" y="256">complete record within the approved budget</text></g></g>
  <text x="62" y="650" fill="#f4f3ec" font-family="Arial, sans-serif" font-size="20">The JSONL event chain stays authoritative. Graph and Markdown views rebuild deterministically.</text>
  <text x="62" y="700" fill="#7e9189" font-family="monospace" font-size="13">CITED / BUDGET-BOUNDED / REPRODUCIBLE</text><text x="1208" y="700" text-anchor="end" fill="#25e6a1" font-family="monospace" font-size="13">QARINAH</text>
</svg>
