<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="700" viewBox="0 0 1440 700" role="img" aria-labelledby="title desc">
<title id="title">Qarinah: your project remembers, every agent gets the proof</title>
<desc id="desc">Permitted project activity passes machine-local opt-in, enters a SHA-256 hash-chained JSONL ledger, produces rebuildable SQLite, graph, Markdown and OKF views, and becomes summary-first recall with exact cited source expansion and a bounded task packet. One local dashboard makes the evidence inspectable.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10" fill="none" stroke="#9baa96" stroke-width="1.8"/></marker></defs>
<rect width="1440" height="700" rx="22" fill="#121b17"/>
<g font-family="Arial, Helvetica, sans-serif">
<text x="64" y="69" fill="#c8f2b0" font-size="17" letter-spacing="3">QARINAH / PROJECT MEMORY WITH PROOF</text>
<text x="64" y="133" fill="#f6f5ec" font-size="46" font-weight="700">The next session starts with evidence.</text>
<text x="64" y="176" fill="#b7c3b7" font-size="21">Record once. Recall the summary. Expand the exact source when it matters.</text>
<g stroke="#5f745f" stroke-width="2" fill="none" marker-end="url(#arrow)"><path d="M290 322H325"/><path d="M548 322H585"/><path d="M808 322H845"/><path d="M1068 322H1105"/></g>
